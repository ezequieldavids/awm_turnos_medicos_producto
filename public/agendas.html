<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendas · Turnos médicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <header class="barra">
    <div class="container contenedor">
      <a class="marca" href="/"><img src="/assets/img/logo-barra.svg" alt="" width="32" height="32"><span>Gestión de Turnos</span></a>
      <div class="usuario">
        <div class="usuario-datos"><span class="usuario-nombre" id="usuario-nombre"></span><span class="usuario-rol" id="usuario-rol"></span></div>
        <button id="cerrar-sesion" type="button" class="btn btn-cerrar btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </header>
  <main class="container py-4">
    <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
    <section id="contenido" class="d-none">
      <nav aria-label="breadcrumb"><ol class="breadcrumb small mb-2"><li class="breadcrumb-item"><a id="volver" href="/">Inicio</a></li><li class="breadcrumb-item active" aria-current="page">Agendas</li></ol></nav>
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-2 mb-3">
        <div><h1 class="titulo-pagina" id="titulo">Agendas</h1><p class="subtitulo-pagina">Planificación y configuración de disponibilidad horaria y consultorios.</p></div>
        <div class="d-flex flex-wrap gap-2"><button id="nuevo" type="button" class="btn btn-primary">+ Nueva Agenda</button></div>
      </div>
      <div class="tarjeta-filtros"><div class="row g-3">
        <div class="col-12 col-md-4" id="contenedor-filtro-profesional"><label for="filtro-profesional" class="form-label">Profesional</label>
          <select id="filtro-profesional" class="form-select"><option value="">Todos los profesionales</option></select></div>
        <div class="col-12 col-md-4"><label for="filtro-consultorio" class="form-label">Consultorio</label>
          <select id="filtro-consultorio" class="form-select"><option value="">Todos los consultorios</option></select></div>
        <div class="col-12 col-md-4"><label for="filtro-estado" class="form-label">Estado</label>
          <select id="filtro-estado" class="form-select"><option value="activas" selected>Solo activas</option><option value="inactivas">Solo inactivas</option><option value="todas">Todas</option></select></div>
      </div></div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr><th scope="col">Profesional</th><th scope="col" class="d-none d-md-table-cell">Consultorio</th><th scope="col" class="d-none d-md-table-cell">Especialidad</th><th scope="col">Día y horario</th><th scope="col" class="d-none d-md-table-cell">Vigencia</th><th scope="col">Estado</th><th scope="col" class="text-end">Acciones</th></tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
      <p id="vacio" class="text-body-secondary mt-3 d-none">No hay agendas para ese filtro.</p>
    </section>
  </main>

  <div class="modal fade" id="modal-formulario" tabindex="-1" aria-labelledby="titulo-formulario" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <form class="modal-content" id="formulario" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-formulario">Nueva agenda</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="error-formulario" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3" id="contenedor-profesional">
            <label for="profesional" class="form-label">Profesional</label>
            <select id="profesional" name="profesional" class="form-select" required></select>
            <div id="error-profesional" class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="consultorio" class="form-label">Consultorio</label>
            <select id="consultorio" name="consultorio" class="form-select" required></select>
            <div id="error-consultorio" class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="especialidad" class="form-label">Especialidad</label>
            <select id="especialidad" name="especialidad" class="form-select" required></select>
            <div id="error-especialidad" class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="diaSemana" class="form-label">Día de la semana</label>
            <select id="diaSemana" name="diaSemana" class="form-select" required>
              <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
              <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="7">Domingo</option>
            </select>
            <div id="error-diaSemana" class="invalid-feedback"></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="horaInicio" class="form-label">Hora de inicio</label>
              <input id="horaInicio" name="horaInicio" type="time" class="form-control" required>
              <div id="error-horaInicio" class="invalid-feedback"></div>
            </div>
            <div class="col-6">
              <label for="horaFin" class="form-label">Hora de fin</label>
              <input id="horaFin" name="horaFin" type="time" class="form-control" required>
              <div id="error-horaFin" class="invalid-feedback"></div>
            </div>
          </div>
          <div class="mb-3">
            <label for="duracionMinutos" class="form-label">Duración de cada turno (minutos)</label>
            <input id="duracionMinutos" name="duracionMinutos" type="number" class="form-control" min="5" max="120" required>
            <div id="error-duracionMinutos" class="invalid-feedback"></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="vigenteDesde" class="form-label">Vigente desde</label>
              <input id="vigenteDesde" name="vigenteDesde" type="date" class="form-control" required>
              <div id="error-vigenteDesde" class="invalid-feedback"></div>
            </div>
            <div class="col-6">
              <label for="vigenteHasta" class="form-label">Hasta <span class="text-body-secondary">(opcional)</span></label>
              <input id="vigenteHasta" name="vigenteHasta" type="date" class="form-control">
              <div id="error-vigenteHasta" class="invalid-feedback"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="/assets/js/agendas.js"></script>
</body>
</html>
