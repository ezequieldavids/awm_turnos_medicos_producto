<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Especialidades · Turnos médicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <header class="barra">
    <div class="container contenedor">
      <a class="marca" href="/"><img src="/assets/img/logo-barra.svg" alt="" width="32" height="32"><span>Gestión de Turnos</span></a>
      <div class="usuario">
        <div class="usuario-datos"><span class="usuario-nombre" id="usuario-nombre"></span><span class="usuario-rol" id="usuario-rol"></span></div>
        <button id="cerrar-sesion" type="button" class="btn btn-cerrar btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </header>
  <main class="container py-4">
    <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
    <section id="contenido" class="d-none">
      <nav aria-label="breadcrumb"><ol class="breadcrumb small mb-2"><li class="breadcrumb-item"><a id="volver" href="/">Inicio</a></li><li class="breadcrumb-item active" aria-current="page">Especialidades</li></ol></nav>
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-2 mb-3">
        <div><h1 class="titulo-pagina">Especialidades Médicas</h1><p class="subtitulo-pagina">Catálogo centralizado de especialidades de atención médica.</p></div>
        <div class="d-flex flex-wrap gap-2"><button id="nueva" type="button" class="btn btn-primary">+ Nueva Especialidad</button></div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr><th scope="col" class="w-25">Nombre</th><th scope="col" class="w-50">Descripción</th><th scope="col">Estado</th><th scope="col" class="text-end">Acciones</th></tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modal-formulario" tabindex="-1" aria-labelledby="titulo-formulario" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formulario" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-formulario">Nueva especialidad</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="error-formulario" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" name="nombre" type="text" class="form-control" maxlength="80" required>
            <div id="error-nombre" class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción <span class="text-body-secondary">(opcional)</span></label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3" maxlength="255"></textarea>
            <div id="error-descripcion" class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="/assets/js/especialidades.js"></script>
</body>
</html>
