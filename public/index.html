<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso · Gestión de Turnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="pantalla-login">
    <div class="card tarjeta-login">
      <img class="logo mx-auto" src="/assets/img/logo.svg" alt="" width="68" height="68">
      <h1>Gestión de Turnos</h1>
      <p class="text-body-secondary mb-4">Acceda al sistema médico con sus credenciales</p>
      <div id="alerta" class="alert alert-danger d-none text-start" role="alert"></div>
      <form id="formulario-login" novalidate>
        <div class="mb-3">
          <label for="dni" class="form-label">DNI / Documento</label>
          <input id="dni" name="dni" class="form-control form-control-lg fs-6" inputmode="numeric" autocomplete="username" placeholder="Ej. 35123456" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control form-control-lg fs-6" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button id="ingresar" type="submit" class="btn btn-primary btn-lg fs-6 w-100">Ingresar</button>
      </form>
      <p class="pie">¿No posee cuenta? Contacte con la recepción del centro médico para su alta.</p>
    </div>
  </main>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
