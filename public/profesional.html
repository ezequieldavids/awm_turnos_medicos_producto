<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Profesional · Turnos médicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary" data-rol="profesional">
  <header class="barra">
    <div class="container contenedor">
      <a class="marca" href="/"><img src="/assets/img/logo-barra.svg" alt="" width="32" height="32"><span>Gestión de Turnos</span></a>
      <div class="usuario">
        <div class="usuario-datos"><span class="usuario-nombre" id="usuario-nombre"></span><span class="usuario-rol" id="usuario-rol"></span></div>
        <button id="cerrar-sesion" type="button" class="btn btn-cerrar btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </header>
  <main class="container py-4">
    <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
    <section id="contenido" class="d-none">
      <div class="bienvenida">
        <h1 id="bienvenida"></h1>
        <p class="text-body-secondary mb-0" id="etiqueta-rol">Panel de control • Rol activo: <span class="rol-activo" id="rol-activo"></span></p>
      </div>
      <div class="row g-3" id="opciones"></div>
    </section>
  </main>
  <script type="module" src="/assets/js/panel.js"></script>
</body>
</html>
